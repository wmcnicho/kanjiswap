name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      # CI=true makes react-scripts treat lint warnings as build errors,
      # which is the behaviour we want as a quality gate.
      - name: Build
        run: npm run build
